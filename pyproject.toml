[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-qa"
version = "0.1.0"
description = "Agentic Software Quality Analyst powered by Claude"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer[all]>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "pyyaml>=6.0",
    "pathspec>=0.12",
]

[project.scripts]
agentic-qa = "agentic_qa.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-aiofiles",
    "respx",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
